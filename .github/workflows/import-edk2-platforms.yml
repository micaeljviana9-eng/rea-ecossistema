name: One-time import — Tianocore edk2-platforms

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-edk2-platforms.yml"

permissions:
  contents: write

jobs:
  import-source-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the bundle
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Import pinned upstream snapshot
        env:
          SOURCE_COMMIT: 013fca79e55c7ac4f3d0eaf23799a9a73ed43dba
        shell: bash
        run: |
          set -euo pipefail

          dest="bundle/projects/iso-reverse-engineering/edk2-platforms"
          readme="$dest/Platform/Ampere/Readme.md"

          # If already imported, remove this one-time helper and finish safely.
          if [ -f "$readme" ]; then
            rm -f .github/workflows/import-edk2-platforms.yml
            git add -A .github/workflows/import-edk2-platforms.yml
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Remove one-time edk2-platforms import workflow"
            git push origin HEAD:main
            exit 0
          fi

          if [ -e "$dest" ]; then
            echo "Destination exists but the expected README is missing; refusing to overwrite partial data."
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="$tmp/edk2-platforms.tar.gz"
          extract="$tmp/extract"
          mkdir -p "$extract"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/tianocore/edk2-platforms/archive/${SOURCE_COMMIT}.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$extract"

          source_dir="$(find "$extract" -mindepth 1 -maxdepth 1 -type d -name 'edk2-platforms-*' -print -quit)"
          test -n "$source_dir"
          mkdir -p "$dest"
          cp -a "$source_dir"/. "$dest"/
          rm -rf "$dest/.git"

          test -f "$readme"
          test -f "$dest/License.txt"

          cat >> bundle/projects/iso-reverse-engineering/SOURCES.md <<'EOF'

          ## edk2-platforms
          - Repository: https://github.com/tianocore/edk2-platforms
          - Imported commit: `013fca79e55c7ac4f3d0eaf23799a9a73ed43dba` (upstream `master`, 2026-10-09)
          - Destination: `bundle/projects/iso-reverse-engineering/edk2-platforms`
          - Method: pinned source archive; upstream Git history is not included.
          - License: preserve and review the included `License.txt`, `License-History.txt`, and any component-specific notices.
          EOF

          rm -f .github/workflows/import-edk2-platforms.yml
          git add "$dest" bundle/projects/iso-reverse-engineering/SOURCES.md .github/workflows/import-edk2-platforms.yml
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Import tianocore edk2-platforms source snapshot"
          git push origin HEAD:main
